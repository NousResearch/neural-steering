name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CPU torch
        run: pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.0"

      - name: Install package (editable) and pytest
        # --no-deps keeps CI light: torch is already installed above and the
        # import smoke / unit tests do not need transformers or accelerate.
        run: |
          pip install -e . --no-deps
          pip install pytest

      - name: Import smoke check
        run: |
          python - <<'PY'
          import neuron_steer.core as core
          for name in ("NeuronSteerer", "Circuit", "NeuronIdx",
                       "steer_neurons", "select_circuit", "compute_attribution"):
              assert hasattr(core, name), f"missing public symbol: {name}"
          print("import smoke OK:", core.__file__)
          PY

      - name: Run unit tests
        run: pytest -q
